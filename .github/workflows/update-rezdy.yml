name: Update Rezdy Dashboard

on:
  schedule:
    # Regenera o dashboard completo (Meta Ads + Rezdy) a cada 15 minutos
    - cron: '*/15 * * * *'
  workflow_dispatch:
    # Also triggerable manually from GitHub Actions tab

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to push the updated HTML

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Rezdy periods data and update analise-rezdy-periodos.html
        env:
          REZDY_API_KEY: ${{ secrets.REZDY_API_KEY }}
        run: python scripts/update_rezdy_data.py

      - name: Dados da Comparação Personalizada de Períodos (data/comparacao.json)
        env:
          REZDY_API_KEY: ${{ secrets.REZDY_API_KEY }}
        run: python scripts/gerar_comparacao.py

      - name: Regenerate full dashboard (Meta Ads + Rezdy) — keeps every chart in sync
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          REZDY_KEY: ${{ secrets.REZDY_API_KEY }}
        run: python gerar_dashboard.py

      - name: Commit and push if data changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet analise-rezdy-periodos.html data/periodos.json data/comparacao.json index.html || (
            git add analise-rezdy-periodos.html data/periodos.json data/comparacao.json index.html &&
            git commit -m "chore: auto-update Rezdy data [skip ci]" &&
            git push
          )
